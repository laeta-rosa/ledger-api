# In-memory H2 database. DB_CLOSE_DELAY=-1 keeps the schema alive for the JVM's
# lifetime; all data is still lost when the application stops.
spring.datasource.url=jdbc:h2:mem:ledger;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Browse the data at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:ledger).
spring.h2.console.enabled=true
